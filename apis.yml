name: Randolph-Brooks FCU
kind: company
description: Randolph-Brooks Federal Credit Union (RBFCU) is a member-owned, not-for-profit
  federal credit union headquartered in Live Oak, Texas, federally insured by the NCUA
  and serving more than one million members across Texas and beyond. Chartered as a
  federal credit union rather than a state or national bank, RBFCU is one of the largest
  credit unions in the United States by membership and assets, offering retail banking,
  mortgages, auto loans, credit cards, and deposit products through branches and digital
  channels. As a member-focused retail institution, RBFCU publishes no first-party public
  developer program, API documentation, or downloadable OpenAPI/Swagger specifications;
  consumer-permissioned account data is reached through third-party aggregators (such as
  Plaid, MX, Finicity, or Akoya) rather than a directly documented open-finance API, and
  it publishes no stated CFPB Section 1033 data-access posture or documented FDX participation.
